<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifa Virtual - Chá de Fraldas</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background-color: #ffeef2;
            background-image: radial-gradient(#ffcad4 15%, transparent 16%), radial-gradient(#ffcad4 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            color: #4a4a4a;
            padding: 20px 10px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(244, 143, 177, 0.3);
            border: 4px solid #ffcad4;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: #d81b60;
            font-size: 26px;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .subtitle {
            font-size: 15px;
            color: #6a6a6a;
            line-height: 1.4;
        }

        .subtitle-status {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            background: #fff;
            padding: 10px;
            border-radius: 10px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
            flex-wrap: wrap;
            gap: 10px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            font-weight: bold;
        }

        .status-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }

        .status-available { background-color: #fff; border: 2px solid #ffccd5; }
        .status-selected { background-color: #ff85a2; border: 2px solid #ff85a2; }
        .status-paid { background-color: #b388ff; border: 2px solid #b388ff; }

        .rifa-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 25px;
            max-height: 500px;
            overflow-y: auto;
            padding: 5px;
            border: 1px solid #ffeef2;
            border-radius: 10px;
        }

        @media (min-width: 600px) {
            .rifa-grid {
                grid-template-columns: repeat(10, 1fr);
            }
        }

        .rifa-grid::-webkit-scrollbar { width: 8px; }
        .rifa-grid::-webkit-scrollbar-track { background: #ffeef2; border-radius: 10px; }
        .rifa-grid::-webkit-scrollbar-thumb { background: #ffcad4; border-radius: 10px; }

        .number-box {
            background: #fff;
            border: 2px solid #ffccd5;
            border-radius: 8px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            color: #d81b60;
        }

        .number-box:hover {
            transform: scale(1.05);
            border-color: #ff85a2;
        }

        .number-box.selected {
            background-color: #ff85a2;
            color: white;
            border-color: #ff5c8a;
        }

        .number-box.paid {
            background-color: #b388ff;
            color: white;
            border-color: #9c27b0;
            cursor: not-allowed;
        }

        .footer-action {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 15px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
            display: none;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            max-width: 800px;
            margin: 0 auto;
            border-radius: 15px 15px 0 0;
        }

        .footer-info {
            font-size: 14px;
            font-weight: bold;
        }

        .btn-submit {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 20px;
        }

        .modal {
            background: white;
            padding: 20px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
        }

        .modal h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #d81b60;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ffccd5;
            border-radius: 8px;
            outline: none;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-cancel { background: #eee; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-confirm { background: #ff85a2; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .spacer { height: 60px; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>👶 Rifa do Chá de Fraldas 🍼</h1>
            <p class="subtitle">Escolha seus números da sorte abaixo para participar do nosso Chá de Fraldas virtual!</p>
        </header>

        <div class="subtitle-status">
            <div class="status-item"><div class="status-color status-available"></div>Livre</div>
            <div class="status-item"><div class="status-color status-selected"></div>Selecionado</div>
            <div class="status-item"><div class="status-color status-paid"></div>Reservado</div>
        </div>

        <div class="rifa-grid" id="grid-rifa"></div>

        <div class="spacer" id="bottom-spacer"></div>
    </div>

    <div class="footer-action" id="footer-action">
        <div class="footer-info">
            <span id="selected-count">0</span> número(s) selecionado(s)
        </div>
        <button class="btn-submit" onclick="openModal()">
            Reservar Agora ➡️
        </button>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <h2>Completar Reserva</h2>
            <div class="form-group">
                <label for="user-name">Seu Nome:</label>
                <input type="text" id="user-name" placeholder="Ex: Maria Silva">
            </div>
            <div class="form-group">
                <label for="user-phone">Seu WhatsApp:</label>
                <input type="text" id="user-phone" placeholder="Ex: (11) 99999-9999">
            </div>
            <p style="font-size: 12px; color: #666; margin-top: 10px;">
                Números selecionados: <strong id="modal-numbers-list"></strong>.
            </p>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
                <button class="btn-confirm" onclick="sendWhatsApp()">Confirmar e Enviar</button>
            </div>
        </div>
    </div>

    <script>
        const totalNumbers = 300; 
        
        // 1. COLOQUE O SEU NÚMERO DE WHATSAPP AQUI (Com 55 e DDD):
        const whatsappNumber = "5511999999999"; 
        
        // 2. ADICIONAR E EXCLUIR RESERVAS:
        // Coloque aqui dentro os números reservados separados por vírgula. 
        // Exemplo para reservar: const paidNumbers = [12, 45, 130];
        // Para EXCLUIR uma reserva, basta apagar o número daqui de dentro!
        const paidNumbers = []; 

        let selectedNumbers = [];

        const grid = document.getElementById('grid-rifa');
        const footer = document.getElementById('footer-action');
        const spacer = document.getElementById('bottom-spacer');
        const countSpan = document.getElementById('selected-count');

        function renderGrid() {
            grid.innerHTML = '';
            for (let i = 1; i <= totalNumbers; i++) {
                const box = document.createElement('div');
                box.classList.add('number-box');
                box.innerText = String(i).padStart(3, '0');

                if (paidNumbers.includes(i)) {
                    box.classList.add('paid');
                } else {
                    if (selectedNumbers.includes(i)) {
                        box.classList.add('selected');
                    }
                    box.addEventListener('click', () => toggleNumber(i, box));
                }
                grid.appendChild(box);
            }
        }

        function toggleNumber(num, element) {
            if (selectedNumbers.includes(num)) {
                selectedNumbers = selectedNumbers.filter(n => n !== num);
                element.classList.remove('selected');
            } else {
                selectedNumbers.push(num);
                element.classList.add('selected');
            }
            updateFooter();
        }

        function updateFooter() {
            if (selectedNumbers.length > 0) {
                footer.style.display = 'flex';
                spacer.style.display = 'block';
                countSpan.innerText = selectedNumbers.length;
            } else {
                footer.style.display = 'none';
                spacer.style.display = 'none';
            }
        }

        function openModal() {
            document.getElementById('modal-overlay').style.display = 'flex';
            document.getElementById('modal-numbers-list').innerText = selectedNumbers.sort((a,b)=>a-b).map(n => String(n).padStart(3, '0')).join(', ');
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }

        function sendWhatsApp() {
            const name = document.getElementById('user-name').value.trim();
            const phone = document.getElementById('user-phone').value.trim();

            if (!name) {
                alert('Por favor, insira o seu nome.');
                return;
            }

            const numbersStr = selectedNumbers.sort((a,b)=>a-b).map(n => String(n).padStart(3, '0')).join(', ');
            const message = `Olá! Reservei os seguintes números para a Rifa:\n\n*Nome:* ${name}\n*Números:* ${numbersStr}`;
            
            const encodedMessage = encodeURIComponent(message);
            window.open(`https://api.whatsapp.com/send?phone=${whatsappNumber}&text=${encodedMessage}`, '_blank');
            
            selectedNumbers = [];
            closeModal();
            renderGrid();
            updateFooter();
        }

        renderGrid();
    </script>
</body>
</html>
